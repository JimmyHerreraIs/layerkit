name: CI

on:
  pull_request:
    branches: [develop, main]
    # "edited" re-runs the checks when the title is fixed.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop, main]

# Cancel a running check when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The coverage threshold lives in pyproject.toml (fail_under).
      - name: Run tests with coverage (pytest)
        run: pytest

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the package metadata
        run: twine check --strict dist/*

      - name: Install the wheel in a clean environment and run the command
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/layerkit" --version

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The title goes through an environment variable, never straight into the
      # script, so a crafted title cannot run commands.
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|chore)(\([a-z0-9-]+\))?!?: [a-z0-9]'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::The title must look like 'feat: add a thing' (types: feat, fix, docs, test, refactor, chore), with a lowercase description."
            echo "Current title: $PR_TITLE"
            exit 1
          fi
          if [ "${#PR_TITLE}" -gt 72 ]; then
            echo "::error::The title has ${#PR_TITLE} characters; the maximum is 72."
            exit 1
          fi

  # The job id/name below ("quality") is the name selected as the required
  # status check in the branch protection rules. It succeeds only when every
  # other job succeeded (or was skipped on purpose), so the jobs above can be
  # added, renamed or split without touching the protection rules.
  quality:
    name: quality
    if: always()
    needs: [lint, test, build, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::At least one job did not succeed."
              exit 1
            fi
          done
